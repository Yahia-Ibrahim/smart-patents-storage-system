version: "3.8"

services:
  minio:
    image: minio/minio
    container_name: patents-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 123123
    ports:
      - "9000:9000"   
      - "9001:9001"   
    volumes:
      - ./data/minio:/data
    mem_limit: 1g
    restart: unless-stopped

