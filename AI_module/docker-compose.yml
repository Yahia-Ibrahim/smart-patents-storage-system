version: "3.9"

services:

  ai-service:

    build: .

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - qdrant
      - minio

  postgres:

    image: postgres:16

    environment:

      POSTGRES_USER: ai

      POSTGRES_PASSWORD: ai

      POSTGRES_DB: ai_db

    ports:
      - "5432:5432"

  qdrant:

    image: qdrant/qdrant

    ports:
      - "6333:6333"

  minio:

    image: minio/minio

    command: server /data

    environment:

      MINIO_ROOT_USER: admin

      MINIO_ROOT_PASSWORD: password

    ports:

      - "9000:9000"

      - "9001:9001"