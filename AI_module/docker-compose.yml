version: "3.9"

services:

  ai-service:

    build: .

    env_file:
      - .env

    depends_on:
      - postgres
      - qdrant
      - minio

  ai-service-api:
    build: .
    container_name: ai-service-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - qdrant

  postgres:

    image: postgres:16

    environment:

      POSTGRES_USER: ai

      POSTGRES_PASSWORD: ai

      POSTGRES_DB: ai_db

    ports:
      - "5432:5432"

  qdrant:

    image: qdrant/qdrant

    ports:
      - "6333:6333"

  minio:

    image: minio/minio

    command: server /data

    environment:

      MINIO_ROOT_USER: admin

      MINIO_ROOT_PASSWORD: password

    ports:

      - "9000:9000"

      - "9001:9001"